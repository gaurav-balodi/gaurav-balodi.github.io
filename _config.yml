# Jekyll / GitHub Pages
theme: minima
markdown: kramdown
permalink: /:categories/:title/
timezone: Asia/Kolkata
lang: en

# Navigation (use these pages if you create the corresponding files)
header_pages:
  - about.md
  - projects.md
  - experience.md

# Exclude local development and private files from the published site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - LICENSE
  - .github
  - .bundle
  - .env
  - .env.*
  - config/database.yml
  - tmp
  - log
